name: Crypto Fast Volume Alert

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  fast-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Paketleri kur
        run: pip install websocket-client requests

      - name: Fast volume scanner çalıştır
        run: python crypto_fast_volume.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

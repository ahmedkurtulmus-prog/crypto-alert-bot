name: Binance WebSocket Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: WebSocket paketini kur
        run: pip install websocket-client

      - name: Binance 15m mum verisini oku
        run: |
          python - <<'PY'
          import websocket
          import json

          url = "wss://fstream.binance.com/market/stream?streams=btcusdt@kline_15m"

          print("Binance 15m mum akışına bağlanılıyor...")

          ws = websocket.create_connection(
              url,
              timeout=30
          )

          print("BAĞLANTI BAŞARILI!")

          for i in range(3):
              message = ws.recv()
              data = json.loads(message)

              k = data["data"]["k"]

              print("")
              print("===== BTCUSDT 15M =====")
              print("Açılış :", k["o"])
              print("Yüksek :", k["h"])
              print("Düşük  :", k["l"])
              print("Kapanış:", k["c"])
              print("Hacim  :", k["v"])
              print("Mum kapandı mı?:", k["x"])

          ws.close()

          print("")
          print("TEST BAŞARILI!")
          PY
